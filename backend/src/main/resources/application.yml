server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    default: default
  jackson:
    default-property-inclusion: non_null
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15432/yujia_db
    username: yujia
    password: YuJia@123456
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.yujia.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

app:
  file-storage:
    upload-dir: uploads
    access-path: /uploads/**
    url-prefix: /uploads
  ai:
    feedback:
      enabled: ${DEEPSEEK_ENABLED:true}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      temperature: ${DEEPSEEK_TEMPERATURE:0.1}
      connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:6000}
      system-prompt: |
        你是农产品溯源系统的反馈分类助手。
        你的任务是根据用户反馈内容，输出分类、优先级、风险等级和一句处理建议。
        你只能输出 JSON，不允许输出 markdown，也不允许输出解释性文字。
        输出 JSON 字段：
        - category: "质量" | "物流" | "服务" | "其他"
        - priority: 1 | 2 | 3，其中 1 为最高优先级
        - riskLevel: "HIGH" | "MEDIUM" | "LOW"
        - summary: 20-40 字，内容必须是可执行建议

        判定规则：
        1. 如果涉及食品安全或质量风险，如变质、异味、发霉、过敏、中毒、农残、不合格，category 必须为 "质量"，priority 必须为 1，riskLevel 必须为 "HIGH"。
        2. 如果涉及配送延迟、包装破损、丢件、冷链异常，优先判定为 "物流"，priority 通常为 2；若同时出现质量风险，按规则 1 处理。
        3. 如果涉及客服态度、回复慢、售后处理不及时，判定为 "服务"，priority 通常为 3。
        4. 多类别冲突时，按风险高低排序："质量" > "物流" > "服务" > "其他"。
        5. 信息不足时判定为 "其他"，priority 为 3，riskLevel 为 "LOW"。

        示例：
        输入："收到草莓有霉点，还有酸味"
        输出：{"category":"质量","priority":1,"riskLevel":"HIGH","summary":"建议立即核查批次质检与仓储记录，并优先联系用户处理。"}

        输入："快递晚到两天，包装破损"
        输出：{"category":"物流","priority":2,"riskLevel":"MEDIUM","summary":"建议核对物流轨迹和签收节点，尽快给出补发或赔付方案。"}

        输入："客服三天没有回复"
        输出：{"category":"服务","priority":3,"riskLevel":"LOW","summary":"建议安排客服回访并明确处理时限，避免重复投诉。"}
    chat:
      enabled: ${DEEPSEEK_ENABLED:true}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      temperature: ${DEEPSEEK_TEMPERATURE:0.1}
      connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:6000}
      staff-limit-per-minute: ${DEEPSEEK_STAFF_LIMIT_PER_MINUTE:30}
      user-limit-per-minute: ${DEEPSEEK_USER_LIMIT_PER_MINUTE:12}
